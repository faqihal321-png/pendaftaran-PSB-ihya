<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PSB - Pondok Pesantren Ihyauth Tholibin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap');
        
        :root { --primary-green: #1e4d2b; --accent-green: #2e7d32; }
        body { background-color: #f8fafc; font-family: 'Plus Jakarta Sans', sans-serif; color: #1e293b; scroll-behavior: smooth; }

        /* --- HERO & POSTER SECTION --- */
        .landing-hero {
            min-height: 100vh;
            background: linear-gradient(135deg, rgba(30, 77, 43, 0.95), rgba(46, 125, 50, 0.9)), 
                        url('https://www.transparenttextures.com/patterns/cubes.png');
            display: flex; align-items: center; justify-content: center; padding: 40px 20px;
        }
        .poster-container {
            max-width: 550px; transform: rotate(-1deg); transition: transform 0.5s ease;
        }
        .poster-container:hover { transform: rotate(0deg) scale(1.02); }
        .poster-img {
            width: 100%; border-radius: 30px; border: 10px solid white;
            box-shadow: 0 30px 60px rgba(0,0,0,0.4);
        }
        .scroll-hint { color: white; margin-top: 40px; animation: bounce 2s infinite; cursor: pointer; }

        /* --- FORM SECTION --- */
        .header-banner { background: var(--primary-green); padding: 80px 0 160px 0; border-radius: 0 0 50px 50px; }
        .main-card {
            border: none; border-radius: 30px; background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px); box-shadow: 0 20px 50px rgba(0,0,0,0.08);
            margin-top: -120px; padding: 50px; border: 1px solid rgba(255,255,255,0.3);
        }
        .kop-area { border-bottom: 2px dashed #e2e8f0; padding-bottom: 30px; margin-bottom: 40px; }
        .logo-main { width: 90px; filter: drop-shadow(0 4px 10px rgba(0,0,0,0.1)); }

        .section-tag {
            display: inline-block; background: #f1f8f4; color: var(--primary-green);
            padding: 6px 16px; border-radius: 50px; font-weight: 700; font-size: 0.75rem;
            margin-bottom: 15px; text-transform: uppercase;
        }

        /* --- INPUT & BUTTONS --- */
        .form-label { font-weight: 700; font-size: 0.85rem; color: #475569; margin-left: 5px; }
        .form-control, .form-select {
            border-radius: 15px; padding: 14px 18px; border: 1px solid #e2e8f0;
            background: #fdfdfd; transition: all 0.3s ease;
        }
        .form-control:focus {
            background: white; border-color: var(--accent-green);
            box-shadow: 0 10px 20px rgba(46, 125, 50, 0.05); transform: translateY(-2px);
        }

        .btn-submit-psb {
            background: linear-gradient(135deg, #1e4d2b 0%, #2e7d32 100%);
            border: none; border-radius: 18px; padding: 20px; font-weight: 800;
            color: white; letter-spacing: 1px; transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .btn-submit-psb:hover {
            transform: translateY(-5px); box-shadow: 0 20px 40px rgba(30, 77, 43, 0.3);
            filter: brightness(1.1);
        }

        @keyframes bounce { 0%, 20%, 50%, 80%, 100% {transform: translateY(0);} 40% {transform: translateY(-10px);} 60% {transform: translateY(-5px);} }
    </style>
</head>
<body>

    <section class="landing-hero">
        <div class="text-center">
            <div class="poster-container">
                <img src="/assets/psb.jpg" alt="Poster PSB" class="poster-img" onerror="this.src='https://via.placeholder.com/600x800?text=Poster+PSB'">
            </div>
            <div class="scroll-hint" onclick="document.getElementById('pendaftaran').scrollIntoView()">
                <p class="mb-1 fw-bold">Klik Untuk Mendaftar</p>
                <i class="fas fa-chevron-down fa-2x"></i>
            </div>
        </div>
    </section>

    <div class="header-banner text-center text-white" id="pendaftaran">
        <div class="container">
            <span class="badge bg-warning text-dark mb-2 px-3 py-2 fw-bold rounded-pill">PENDAFTARAN DIBUKA</span>
            <h1 class="fw-800 display-5">PENERIMAAN SANTRI BARU</h1>
            <p class="opacity-75 lead">Tahun Ajaran 2026/2027</p>
        </div>
    </div>

    <div class="container mb-5">
        <div class="row justify-content-center">
            <div class="col-lg-9">
                <div class="main-card">
                    
                    <div class="kop-area d-flex align-items-center justify-content-center text-center flex-column flex-md-row">
                        <img src="/assets/logo-pondok.png" class="logo-main mb-3 mb-md-0 me-md-4">
                        <div class="text-md-start">
                            <h4 class="fw-bold mb-1" style="color: var(--primary-green);">PONDOK PESANTREN IHYAUTH THOLIBIN</h4>
                            <p class="text-muted small mb-0"><i class="fas fa-map-marker-alt me-2"></i>Jl. Pasar Jumat, Semarang Jaya, Air Hitam, Lampung Barat</p>
                        </div>
                    </div>

                    <form action="/daftar" method="POST" enctype="multipart/form-data">
                        
                        <div class="section-tag">Biodata Santri</div>
                        <div class="row g-4 mb-5">
                            <div class="col-md-7">
                                <label class="form-label">Nama Lengkap Santri</label>
                                <input type="text" name="nama" class="form-control shadow-sm" placeholder="Masukkan nama sesuai ijazah" required>
                            </div>
                            <div class="col-md-5">
                                <label class="form-label">Pilih Jenjang</label>
                                <select name="jenjang" class="form-select shadow-sm" required>
                                    <option value="" selected disabled>Pilih Jenjang</option>
                                    <option value="SMP/MTs">SMP/MTs (Sekolah Menengah Pertama)</option>
                                    <option value="SMA/MA">SMA/MA (Sekolah Menengah Atas)</option>
                                </select>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">NISN (10 Digit)</label>
                                <input type="number" name="nisn" class="form-control shadow-sm" placeholder="Contoh: 0012345678" required>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">NIK Sesuai KK</label>
                                <input type="number" name="nik" class="form-control shadow-sm" placeholder="16 Digit NIK" required>
                            </div>
                            <div class="col-12">
                                <label class="form-label">Alamat Lengkap Domisili</label>
                                <textarea name="alamat" class="form-control shadow-sm" rows="3" placeholder="Dusun, RT/RW, Desa, Kecamatan..." required></textarea>
                            </div>
                        </div>

                        <div class="section-tag">Data Orang Tua / Wali</div>
                        <div class="row g-4 mb-5">
                            <div class="col-md-6">
                                <label class="form-label">Nama Ayah Kandung</label>
                                <input type="text" name="namaAyah" class="form-control shadow-sm" required>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Pekerjaan Ayah</label>
                                <input type="text" name="kerjaAyah" class="form-control shadow-sm" required>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Nama Ibu Kandung</label>
                                <input type="text" name="namaIbu" class="form-control shadow-sm" required>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">WhatsApp (Untuk Kwitansi)</label>
                                <input type="number" name="whatsapp" class="form-control shadow-sm" placeholder="Contoh: 0812345678" required>
                            </div>
                        </div>

                        <div class="section-tag">Persyaratan Dokumen</div>
                        <div class="row g-3 mb-5">
                            <div class="col-md-6">
                                <div class="p-3 border rounded-4 bg-light shadow-sm">
                                    <label class="form-label"><i class="fas fa-camera me-2"></i>Pas Foto 3x4</label>
                                    <input type="file" name="foto" class="form-control bg-white" accept="image/*" required>
                                </div>
                            </div>
                            <div class="col-md-6">
                                <div class="p-3 border rounded-4 bg-light shadow-sm">
                                    <label class="form-label"><i class="fas fa-file-pdf me-2"></i>Kartu Keluarga (KK)</label>
                                    <input type="file" name="kk" class="form-control bg-white" accept="image/*,application/pdf" required>
                                </div>
                            </div>
                            <div class="col-md-6">
                                <div class="p-3 border rounded-4 bg-light shadow-sm">
                                    <label class="form-label"><i class="fas fa-id-card me-2"></i>KTP Orang Tua</label>
                                    <input type="file" name="ktp" class="form-control bg-white" accept="image/*,application/pdf" required>
                                </div>
                            </div>
                            <div class="col-md-6">
                                <div class="p-3 border rounded-4 bg-light shadow-sm">
                                    <label class="form-label"><i class="fas fa-graduation-cap me-2"></i>Ijazah / SKL</label>
                                    <input type="file" name="ijazah" class="form-control bg-white" accept="image/*,application/pdf" required>
                                </div>
                            </div>
                        </div>

                        <button type="submit" class="btn btn-submit-psb w-100 shadow-lg mt-4">
                            <i class="fas fa-check-circle me-2"></i> KONFIRMASI & KIRIM PENDAFTARAN
                        </button>
                    </form>

                    <div class="text-center mt-5">
                        <small class="text-muted">© 2026 PP. Ihyauth Tholibin - Sistem Informasi PSB Terpadu</small>
                    </div>
                </div>
            </div>
        </div>
    </div>

</body>
</html>
